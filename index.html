
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>野寻加拿大28学堂</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --tg-theme-bg-color: #ffffff;
      --tg-theme-text-color: #000000;
      --tg-theme-hint-color: #999999;
      --tg-theme-button-color: #2481cc;
      --tg-theme-button-text-color: #ffffff;
      --tg-theme-secondary-bg-color: #f1f1f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      min-height: 100vh;
    }
    .header {
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      background: var(--tg-theme-secondary-bg-color);
    }
    .main-menu {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .level-card {
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
    }
    .level-card.disabled { opacity: 0.5; cursor: not-allowed; }
    .content { display: none; padding: 12px; }
    .content.active { display: block; }
    .back-btn {
      margin-bottom: 12px;
      padding: 8px 16px;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      border: none;
      border-radius: 8px;
      font-size: 14px;
    }
    .alert-box {
      background: #ffebee;
      border: 2px solid #e74c3c;
      color: #c0392b;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 12px;
      display: none;
    }
    .stats {
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .stats h3 { margin: 0 0 12px 0; text-align: center; }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: center;
    }
    .stat-item {
      background: var(--tg-theme-bg-color);
      padding: 10px;
      border-radius: 8px;
    }
    .road-section { margin-bottom: 20px; }
    .road-title {
      background: #f5d76e;
      color: #333;
      padding: 10px;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
      text-align: center;
    }
    .road-grid {
      display: flex;
      overflow-x: auto;
      background: #fff;
      border: 1px solid #eee;
      border-top: none;
      padding: 8px;
      min-height: 180px;
      gap: 4px;
    }
    .road-column {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }
    .circle.red { background: #e74c3c; }
    .circle.blue { background: #3498db; }
    .loading { text-align: center; padding: 40px; color: var(--tg-theme-hint-color); }
    .refresh-tip {
      text-align: center;
      font-size: 12px;
      color: var(--tg-theme-hint-color);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="header">野寻加拿大28学堂</div>

  <div id="menu" class="main-menu">
    <div class="level-card" onclick="openLevel('beginner')">初级学堂</div>
    <div class="level-card disabled">中级学堂（即将开放）</div>
    <div class="level-card disabled">高级学堂（即将开放）</div>
  </div>

  <div id="beginner" class="content">
    <button class="back-btn" onclick="backToMenu()">← 返回</button>
    <div class="refresh-tip">每30秒自动刷新</div>
    <div id="alert-box" class="alert-box"></div>
    <div id="loading" class="loading">正在获取最新开奖数据...</div>
    <div id="beginner-content" style="display:none;">
      <div class="stats">
        <h3>最近100期统计</h3>
        <div class="stats-grid">
          <div class="stat-item">大：<span id="big-count">0</span> 次 (<span id="big-percent">0</span>%)</div>
          <div class="stat-item">小：<span id="small-count">0</span> 次 (<span id="small-percent">0</span>%)</div>
          <div class="stat-item">单：<span id="odd-count">0</span> 次 (<span id="odd-percent">0</span>%)</div>
          <div class="stat-item">双：<span id="even-count">0</span> 次 (<span id="even-percent">0</span>%)</div>
        </div>
      </div>

      <div class="road-section">
        <div class="road-title">大小路</div>
        <div id="big-small-road" class="road-grid"></div>
      </div>

      <div class="road-section">
        <div class="road-title">单双路</div>
        <div id="odd-even-road" class="road-grid"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let refreshTimer = null;

    function openLevel(level) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById(level).classList.add('active');
      if (level === 'beginner') {
        loadBeginnerData();
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(loadBeginnerData, 30000);
      }
    }

    function backToMenu() {
      if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
      document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
      document.getElementById('menu').style.display = 'flex';
    }

    async function loadBeginnerData() {
      const loading = document.getElementById('loading');
      const content = document.getElementById('beginner-content');

      if (content.style.display === 'none') {
        loading.style.display = 'block';
      }

      try {
        const res = await fetch('https://pc28.world/api/v1/draws?limit=100&t=' + Date.now());
        const json = await res.json();
        if (!json.ok) throw new Error('数据获取失败');

        const draws = json.data.items.reverse(); // 从旧到新
        renderStats(draws);
        renderRoad(draws, 'big', 'big-small-road');
        renderRoad(draws, 'odd', 'odd-even-road');
        checkStreaks(draws);

        loading.style.display = 'none';
        content.style.display = 'block';
      } catch (e) {
        loading.textContent = '数据加载失败，请稍后重试';
        console.error(e);
      }
    }

   
function playAlertSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // 高音
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    
    oscillator.start();
    // 响三声
    setTimeout(() => oscillator.frequency.setValueAtTime(660, audioCtx.currentTime), 200);
    setTimeout(() => oscillator.frequency.setValueAtTime(880, audioCtx.currentTime), 400);
    setTimeout(() => {
      oscillator.stop();
      audioCtx.close();
    }, 600);
  } catch (e) {
    console.log('无法播放声音', e);
  }
}

function checkStreaks(draws) {
  const alertBox = document.getElementById('alert-box');
  const alerts = [];

  const latest = draws[draws.length - 1];
  
  // 连大 / 连小
  let bigSmallStreak = 1;
  const isBig = latest.big;
  for (let i = draws.length - 2; i >= 0; i--) {
    if (draws[i].big === isBig) bigSmallStreak++;
    else break;
  }
  if (bigSmallStreak >= 5) {
    alerts.push(`已连${isBig ? '大' : '小'} ${bigSmallStreak} 期`);
  }

  // 连单 / 连双
  let oddEvenStreak = 1;
  const isOdd = latest.odd;
  for (let i = draws.length - 2; i >= 0; i--) {
    if (draws[i].odd === isOdd) oddEvenStreak++;
    else break;
  }
  if (oddEvenStreak >= 5) {
    alerts.push(`已连${isOdd ? '单' : '双'} ${oddEvenStreak} 期`);
  }

  if (alerts.length > 0) {
    alertBox.innerHTML = alerts.join('<br>');
    alertBox.style.display = 'block';
    playAlertSound(); // 播放提示音
  } else {
    alertBox.style.display = 'none';
  }
}

    function renderStats(draws) {
      let big = 0, small = 0, odd = 0, even = 0;
      draws.forEach(d => {
        if (d.big) big++; else small++;
        if (d.odd) odd++; else even++;
      });
      const total = draws.length;
      document.getElementById('big-count').textContent = big;
      document.getElementById('small-count').textContent = small;
      document.getElementById('odd-count').textContent = odd;
      document.getElementById('even-count').textContent = even;
      document.getElementById('big-percent').textContent = ((big / total) * 100).toFixed(1);
      document.getElementById('small-percent').textContent = ((small / total) * 100).toFixed(1);
      document.getElementById('odd-percent').textContent = ((odd / total) * 100).toFixed(1);
      document.getElementById('even-percent').textContent = ((even / total) * 100).toFixed(1);
    }

    function renderRoad(draws, type, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const columns = [];
      let currentCol = [];

      draws.forEach(d => {
        const isPositive = type === 'big' ? d.big : d.odd;
        const label = type === 'big' ? (d.big ? '大' : '小') : (d.odd ? '单' : '双');
        const color = isPositive ? 'red' : 'blue';

        if (currentCol.length === 0 || currentCol[0].isPositive === isPositive) {
          currentCol.push({ label, color, isPositive });
        } else {
          columns.push(currentCol);
          currentCol = [{ label, color, isPositive }];
        }
      });
      if (currentCol.length) columns.push(currentCol);

      columns.forEach(col => {
        const colDiv = document.createElement('div');
        colDiv.className = 'road-column';
        col.forEach(item => {
          const circle = document.createElement('div');
          circle.className = `circle ${item.color}`;
          circle.textContent = item.label;
          colDiv.appendChild(circle);
        });
        container.appendChild(colDiv);
      });
    }
  </script>
</body>
</html>
