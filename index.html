<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>野寻加拿大28学堂</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 20px 30px; text-align: center; }
    .header h1 { font-size: 26px; margin-bottom: 8px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .main-menu { padding: 20px; }
    .level-card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); cursor: pointer; }
    .level-card.disabled { opacity: 0.55; cursor: not-allowed; }
    .icon-box { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .icon-beginner { background: #e8f5e9; }
    .icon-intermediate { background: #fff3e0; }
    .icon-advanced { background: #fce4ec; }
    .card-info h3 { font-size: 18px; margin-bottom: 4px; }
    .card-info p { font-size: 13px; color: #888; }
    .badge { margin-left: auto; background: #eee; color: #888; font-size: 12px; padding: 4px 10px; border-radius: 20px; }
    .content { display: none; padding: 12px; background: white; min-height: 100vh; }
    .content.active { display: block; }
    .back-btn { margin-bottom: 12px; padding: 10px 18px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 15px; }
    .pattern-item { background: #f8f9fa; border-radius: 12px; padding: 16px; margin-bottom: 10px; cursor: pointer; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    .no-pattern { text-align: center; color: #999; padding: 40px 0; }
    .scholarship-content { background: #f8f9fa; border-radius: 12px; padding: 16px; margin: 10px 0; line-height: 1.6; white-space: pre-wrap; font-size: 15px; }
    .contact-link { display: block; background: #e3f2fd; border-radius: 10px; padding: 14px; margin: 8px 0; text-decoration: none; color: #1976d2; font-weight: 500; }
    .trend-item { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: white; flex-shrink: 0; }
    .green { background: #2ecc71; }
    .gray { background: #95a5a6; }
    .red { background: #e74c3c; }
    .blue { background: #3498db; }
    .black { background: #000; color: #fff; }
    .tail-0, .mod-0 { background: #e74c3c; color: white; }
    .tail-1, .mod-1 { background: #e67e22; color: white; }
    .tail-2, .mod-2 { background: #f1c40f; color: #333; }
    .tail-3, .mod-3 { background: #2ecc71; color: white; }
    .tail-4 { background: #1abc9c; color: white; }
    .tail-5 { background: #3498db; color: white; }
    .tail-6 { background: #9b59b6; color: white; }
    .tail-7 { background: #e91e63; color: white; }
    .tail-8 { background: #ffffff; color: #333; border: 1px solid #ddd; }
    .tail-9 { background: #2c3e50; color: white; }
  </style>
</head>
<body>
  <div id="menu">
    <div class="header">
      <h1>野寻加拿大28学堂</h1>
      <p>学习 · 统计 · 规律分析</p>
    </div>
    <div class="main-menu">
      <div class="level-card" onclick="openLevel('beginner')">
        <div class="icon-box icon-beginner">🌱</div>
        <div class="card-info"><h3>初级学堂</h3><p>多种规律看板</p></div>
      </div>
      <div class="level-card" onclick="openLevel('intermediate')">
        <div class="icon-box icon-intermediate">🔥</div>
        <div class="card-info"><h3>中级学堂</h3><p>组合 · 尾数 · 极值 · 形态</p></div>
      </div>
      <div class="level-card" onclick="openLevel('advanced')">
        <div class="icon-box icon-advanced">👑</div>
        <div class="card-info"><h3>高级学堂</h3><p>百位 · 十位 · 个位 · 倍数</p></div>
      </div>
      <div class="level-card" onclick="openScholarship()">
        <div class="icon-box" style="background:#e3f2fd;">🎓</div>
        <div class="card-info"><h3>申请奖学金</h3><p>学习奖励申请</p></div>
      </div>
      <div class="level-card" onclick="openCommunity()">
        <div class="icon-box" style="background:#f3e5f5;">💬</div>
        <div class="card-info"><h3>野寻社区</h3><p>交流讨论区</p></div>
      </div>
    </div>
  </div>

  <div id="beginner" class="content">
    <button class="back-btn" onclick="backToMenu()">← 返回主界面</button>
    <div id="pattern-list"></div>
  </div>

  <div id="intermediate" class="content">
    <button class="back-btn" onclick="backToMenu()">← 返回主界面</button>
    <div id="intermediate-list"></div>
  </div>

  <div id="advanced" class="content">
    <button class="back-btn" onclick="backToMenu()">← 返回主界面</button>
    <div id="advanced-list"></div>
  </div>

  <div id="scholarship" class="content">
    <button class="back-btn" onclick="backToMenu()">← 返回主界面</button>
    <div id="scholarship-list"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function openCommunity() {
      if (tg.openTelegramLink) tg.openTelegramLink('https://t.me/ooxxyx');
      else window.open('https://t.me/ooxxyx', '_blank');
    }

    function openScholarship() {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('scholarship').classList.add('active');
      renderScholarshipList();
    }

    function renderScholarshipList() {
      const list = document.getElementById('scholarship-list');
      list.innerHTML = `
        <div class="pattern-item" onclick="showScholarship('xingguang')">🌟 星光奖学金 <span>›</span></div>
        <div class="pattern-item" onclick="showScholarship('duxing')">🌷 笃行奖学金 <span>›</span></div>
        <div class="pattern-item" onclick="showScholarship('xin ya')">🌱 新芽奖学金 <span>›</span></div>
        <div class="pattern-item" onclick="showScholarship('contact')">联系经办人 <span>›</span></div>
      `;
    }

    function showScholarship(type) {
      clearInlineResults();
      const list = document.getElementById('scholarship-list');
      const items = list.querySelectorAll('.pattern-item');
      let target = null;
      items.forEach(item => {
        if (item.getAttribute('onclick')?.includes(type)) target = item;
      });
      if (!target) return;

      const next = target.nextElementSibling;
      if (next && next.classList.contains('inline-result')) {
        next.remove();
        return;
      }

      const resultDiv = document.createElement('div');
      resultDiv.className = 'inline-result';
      resultDiv.style.cssText = 'margin:8px 0 16px;';

      if (type === 'xingguang') {
        resultDiv.innerHTML = `<div class="scholarship-content">🌟 【星光奖学金】 🌟

📚 申请条件

1️⃣ 注册成为 野寻 HM 会员。
2️⃣ 已领取过 笃行奖学金。
3️⃣ 完成 百位数／十位数／个位数数字竞猜50局，且竞猜数字流水 超过25000。
4️⃣ 完成 和值数字竞猜25局，且竞猜和值数字流水 超过25000。

💌 完成以上四项，即可申请星光奖学金。</div>`;
      } else if (type === 'duxing') {
        resultDiv.innerHTML = `<div class="scholarship-content">🌷 【笃行奖学金】 🌷

📚 申请条件

1️⃣ 注册成为 野寻 HM 会员。
2️⃣ 已领取过 新芽奖学金。
3️⃣ 参与 组合竞猜，且组合竞猜流水 不低于80000。
4️⃣ 参与 和值尾数竞猜，且和值尾数竞猜流水 不低于5000。
5️⃣ 参与 极大极小竞猜，且极大极小竞猜流水 不低于5000。
6️⃣ 参与 对子顺子豹子竞猜，且对子顺子豹子竞猜流水 不低于3000。

💌 完成以上六项，即可申请笃行奖学金。</div>`;
      } else if (type === 'xin ya') {
        resultDiv.innerHTML = `<div class="scholarship-content">🌱 【新芽奖学金】 🌱

📚 申请条件

1️⃣ 注册成为 野寻 HM 会员。
2️⃣ 参与 大小单双竞猜，且大小单双竞猜流水 超过50000。

💌 完成以上两项，即可申请新芽奖学金。</div>`;
      } else if (type === 'contact') {
        resultDiv.innerHTML = `
          <div class="scholarship-content">请选择联系经办人：</div>
          <a class="contact-link" href="https://t.me/chase_psz" target="_blank">朴社长</a>
          <a class="contact-link" href="https://t.me/chase_bd" target="_blank">拾光</a>
        `;
      }

      target.after(resultDiv);
    }

    let draws = [];
    let refreshTimer = null;

    const beginnerPatterns = [
      { id: 'frog', name: '青蛙跳规律看板' },
      { id: '2f1t', name: '两房一厅规律看板' },
      { id: '3f1t', name: '三房一厅规律看板' },
      { id: '2f2t', name: '两房两厅规律看板' },
      { id: '3f2t', name: '三房两厅规律看板' },
      { id: '3f3t', name: '三房三厅规律看板' },
      { id: '4dragon', name: '四小龙规律看板' },
      { id: '5dragon', name: '五小龙规律看板' },
      { id: '6dragon', name: '六长龙规律看板' }
    ];

    const intermediateItems = [
      { id: 'combo', name: '组合走势规律研判' },
      { id: 'tail', name: '和值尾数走势规律研判' },
      { id: 'extreme', name: '极大极小走势规律研判' },
      { id: 'shape', name: '对子顺子豹子走势规律研判' }
    ];

    const advancedItems = [
      { id: 'n1', name: '百位数规律' },
      { id: 'n2', name: '十位数规律' },
      { id: 'n3', name: '个位数规律' },
      { id: 'mod3', name: '和值除以3余数' },
      { id: 'mod4', name: '和值除以4余数' }
    ];

    const comboSubItems = [
      { id: 'road', name: '路子图' },
      { id: 'grid', name: '百宫格图' },
      { id: 'frogAlert', name: '单组合青蛙跳' },
      { id: 'fourColor', name: '四色牌走势' },
      { id: 'coldAlert', name: '单组合冷门' }
    ];

    function openLevel(level) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById(level).classList.add('active');
      if (level === 'beginner') {
        loadData(true);
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(() => loadData(true), 30000);
      } else if (level === 'intermediate') {
        renderIntermediateList();
        loadData(false);
        if (refreshTimer) clearInterval(refreshTimer);
       refreshTimer = setInterval(async () => {
  await loadData(false);
  renderIntermediateList();
}, 30000);
      } else if (level === 'advanced') {
        renderAdvancedList();
        loadData(false);
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(async () => {
  await loadData(false);
  renderAdvancedList();
}, 30000);
      }
    }

    function backToMenu() {
      if (refreshTimer) clearInterval(refreshTimer);
      document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
      document.getElementById('menu').style.display = 'block';
    }

    function renderIntermediateList() {
      const list = document.getElementById('intermediate-list');
      list.innerHTML = intermediateItems.map(item =>
        `<div class="pattern-item" onclick="openIntermediateItem('${item.id}')">${item.name} <span>›</span></div>`
      ).join('');
    }

    function renderAdvancedList() {
  const list = document.getElementById('advanced-list');
  list.innerHTML = advancedItems.map(item =>
    `<div class="pattern-item" onclick="openAdvancedItem('${item.id}')">${item.name} <span>›</span></div>`
  ).join('') + `<div class="pattern-item" onclick="showMenu()" style="background:#eee;margin-top:16px;">← 返回主界面</div>`;
}

    function openIntermediateItem(id) {
  clearInlineResults();
  const list = document.getElementById('intermediate-list');
  if (id === 'combo') {
    list.innerHTML = comboSubItems.map(item =>
      `<div class="pattern-item" onclick="openComboSub('${item.id}')">${item.name} <span>›</span></div>`
    ).join('') + `<div class="pattern-item" onclick="renderIntermediateList()" style="background:#eee;">← 返回上一级</div>`;
  } else if (id === 'tail') {
    const recent = getRecent(90);
    list.innerHTML = '<div style="text-align:center;margin:12px 0;font-weight:bold;">近90期和值尾数百宫格</div>' + renderTailGrid(recent) +
      `<div class="pattern-item" onclick="renderIntermediateList()" style="background:#eee;margin-top:16px;">← 返回上一级</div>`;
  } else if (id === 'extreme') {
    const recent = getRecent(90);
    list.innerHTML = '<div style="text-align:center;margin:12px 0;font-weight:bold;">近90期极大极小百宫格</div>' + renderExtremeGrid(recent) +
      `<div class="pattern-item" onclick="renderIntermediateList()" style="background:#eee;margin-top:16px;">← 返回上一级</div>`;
  } else if (id === 'shape') {
    const recent = getRecent(90);
    list.innerHTML = '<div style="text-align:center;margin:12px 0;font-weight:bold;">近90期对子顺子豹子百宫格</div>' + renderShapeGrid(recent) +
      `<div class="pattern-item" onclick="renderIntermediateList()" style="background:#eee;margin-top:16px;">← 返回上一级</div>`;
  } else {
    showPlaceholder(list.querySelector(`[onclick*="${id}"]`));
  }
}

    function openAdvancedItem(id) {
      clearInlineResults();
      const list = document.getElementById('advanced-list');
      const recent = getRecent(90);
      let title = '';
      let html = '';
      if (id === 'n1') {
        title = '近90期百位数百宫格';
        html = renderDigitGrid(recent, 'n1');
      } else if (id === 'n2') {
        title = '近90期十位数百宫格';
        html = renderDigitGrid(recent, 'n2');
      } else if (id === 'n3') {
        title = '近90期个位数百宫格';
        html = renderDigitGrid(recent, 'n3');
      } else if (id === 'mod3') {
        title = '近90期和值除以3余数';
        html = renderModGrid(recent, 3);
      } else if (id === 'mod4') {
        title = '近90期和值除以4余数';
        html = renderModGrid(recent, 4);
      }
      list.innerHTML = `<div style="text-align:center;margin:12px 0;font-weight:bold;">${title}</div>` + html;
    }

    function openComboSub(subId) {
      clearInlineResults();
      const items = document.querySelectorAll('#intermediate-list .pattern-item');
      let target = null;
      items.forEach(item => {
        if (item.getAttribute('onclick')?.includes(subId)) target = item;
      });
      if (!target) return;

      const next = target.nextElementSibling;
      if (next && next.classList.contains('inline-result')) {
        next.remove();
        return;
      }

      const resultDiv = document.createElement('div');
      resultDiv.className = 'inline-result';
      resultDiv.style.cssText = 'margin:8px 0 16px;padding:12px;background:#f8f9fa;border-radius:12px;';

      const recent = getRecent(30);

      if (subId === 'road') {
        resultDiv.innerHTML = '<div style="text-align:center;margin-bottom:8px;font-weight:bold;">近30期组合路子图</div>' + renderComboRoad(recent);
      } else if (subId === 'grid') {
        resultDiv.innerHTML = '<div style="text-align:center;margin-bottom:8px;font-weight:bold;">近60期百宫格图</div>' + renderComboGrid(getRecent(60));
      } else if (subId === 'frogAlert') {
        const matched = isSingleComboFrog(recent);
        resultDiv.innerHTML = matched
          ? '<div style="text-align:center;margin-bottom:8px;font-weight:bold;">近30期走势（单组合青蛙跳）</div>' + renderComboRoad(recent)
          : '<div class="no-pattern">暂时无此规律</div>';
      } else if (subId === 'fourColor') {
        const matched = isFourColorCycle(recent);
        resultDiv.innerHTML = matched
          ? '<div style="text-align:center;margin-bottom:8px;font-weight:bold;">近30期走势（四色牌）</div>' + renderComboRoad(recent)
          : '<div class="no-pattern">暂时无此规律</div>';
      } else if (subId === 'coldAlert') {
        const matched = isColdCombo(recent);
        resultDiv.innerHTML = matched
          ? '<div style="text-align:center;margin-bottom:8px;font-weight:bold;">近30期走势（单组合冷门）</div>' + renderComboRoad(recent)
          : '<div class="no-pattern">暂时无此规律</div>';
      }

      target.after(resultDiv);
    }

    function showPlaceholder(target) {
      if (!target) return;
      const div = document.createElement('div');
      div.className = 'inline-result';
      div.style.cssText = 'margin:8px 0 16px;padding:12px;background:#f8f9fa;border-radius:12px;';
      div.innerHTML = '<div class="no-pattern">功能开发中，敬请期待</div>';
      target.after(div);
    }

    function clearInlineResults() {
      document.querySelectorAll('.inline-result').forEach(el => el.remove());
    }

    async function loadData(renderBeginner = false) {
      try {
        const res = await fetch('https://pc28.world/api/v1/draws?limit=100&_=' + Date.now());
        const json = await res.json();
        if (json.ok) {
          draws = json.data.items.slice().reverse();
          if (renderBeginner) renderPatternList();
        }
      } catch (e) {}
    }

    function getRecent(n = 30) { return draws.slice(-n); }

    function renderPatternList() {
      const list = document.getElementById('pattern-list');
      if (!list) return;
      list.innerHTML = beginnerPatterns.map(p => {
        const matched = isPatternMatched(p.id);
        const badge = matched ? '<span style="color:#e74c3c;font-size:13px;margin-left:8px;">一条发财路未读</span>' : '';
        return `<div class="pattern-item" onclick="checkPattern('${p.id}')">${p.name}${badge} <span>›</span></div>`;
      }).join('');
    }

    function isPatternMatched(id) {
      if (!draws.length) return false;
      const recent = getRecent(40);
      if (id === 'frog') return isFrogJump(recent);
      if (id === '2f1t') return isHouseHall(recent, 2, 1);
      if (id === '3f1t') return isHouseHall(recent, 3, 1);
      if (id === '2f2t') return isHouseHall(recent, 2, 2);
      if (id === '3f2t') return isHouseHall(recent, 3, 2);
      if (id === '3f3t') return isHouseHall(recent, 3, 3);
      if (id === '4dragon') return isDragon(recent, 4);
      if (id === '5dragon') return isDragon(recent, 5);
      if (id === '6dragon') return isDragon(recent, 6);
      return false;
    }

    function checkPattern(id) {
      clearInlineResults();
      const items = document.querySelectorAll('#pattern-list .pattern-item');
      let targetItem = null;
      items.forEach(item => {
        if (item.getAttribute('onclick')?.includes(id)) targetItem = item;
      });
      if (!targetItem) return;

      const next = targetItem.nextElementSibling;
      if (next?.classList.contains('inline-result')) { next.remove(); return; }

      const recent = getRecent(40);
      let matched = false;
      const displayData = getRecent(20);

      if (id === 'frog') matched = isFrogJump(recent);
      else if (id === '2f1t') matched = isHouseHall(recent, 2, 1);
      else if (id === '3f1t') matched = isHouseHall(recent, 3, 1);
      else if (id === '2f2t') matched = isHouseHall(recent, 2, 2);
      else if (id === '3f2t') matched = isHouseHall(recent, 3, 2);
      else if (id === '3f3t') matched = isHouseHall(recent, 3, 3);
      else if (id === '4dragon') matched = isDragon(recent, 4);
      else if (id === '5dragon') matched = isDragon(recent, 5);
      else if (id === '6dragon') matched = isDragon(recent, 6);

      const resultDiv = document.createElement('div');
      resultDiv.className = 'inline-result';
      resultDiv.style.cssText = 'margin:8px 0 16px;padding:12px;background:#f8f9fa;border-radius:12px;';
      resultDiv.innerHTML = matched
        ? '<div style="text-align:center;margin-bottom:8px;font-weight:bold;">近20期走势</div>' + renderTrend(displayData)
        : '<div class="no-pattern">暂时无此规律</div>';
      targetItem.after(resultDiv);
    }

    function isFrogJump(arr) {
  if (arr.length < 5) return false;
  const recent = arr.slice(-20);

  function hasStrictAlternating(key, minChanges = 4) {
    let changes = 0;
    for (let i = 1; i < recent.length; i++) {
      if (recent[i][key] !== recent[i-1][key]) {
        changes++;
      } else {
        changes = 0;
      }
      if (changes >= minChanges) return true;
    }
    return false;
  }

  return hasStrictAlternating('big', 4) || hasStrictAlternating('odd', 4);
}

    function isHouseHall(arr, house, hall) {
      const need = Math.ceil((house + hall) * 2.5);
      if (arr.length < need) return false;
      const last = arr.slice(-need);
      function checkPattern(key) {
        const groups = [];
        let prev = null, cnt = 0;
        for (const d of last) {
          const v = !!d[key];
          if (v === prev) cnt++;
          else {
            if (prev !== null) groups.push(cnt);
            prev = v;
            cnt = 1;
          }
        }
        if (prev !== null) groups.push(cnt);
        if (groups.length < 5) return false;
        for (let i = 0; i <= groups.length - 5; i++) {
          if (groups[i] === house && groups[i+1] === hall && groups[i+2] === house && groups[i+3] === hall && groups[i+4] >= house) {
            return true;
          }
        }
        return false;
      }
      return checkPattern('big') || checkPattern('odd');
    }

    function isDragon(arr, count) {
  if (arr.length < count) return false;
  const recent = arr.slice(-30);
  
  function hasConsecutive(key, minStreak) {
    let streak = 1;
    for (let i = recent.length - 1; i > 0; i--) {
      if (recent[i][key] === recent[i-1][key]) {
        streak++;
        if (streak >= minStreak) return true;
      } else {
        streak = 1;
      }
    }
    return false;
  }
  
  return hasConsecutive('big', count) || hasConsecutive('odd', count);
}

    function renderTrend(arr) {
      if (!arr.length) return '';
      const columns = [];
      let currentCol = [];
      arr.forEach(d => {
        const isBig = d.big;
        if (!currentCol.length || currentCol[0].isBig === isBig) {
          currentCol.push({ label: isBig ? '大' : '小', color: isBig ? 'red' : 'blue', isBig });
        } else {
          columns.push([...currentCol]);
          currentCol = [{ label: isBig ? '大' : '小', color: isBig ? 'red' : 'blue', isBig }];
        }
      });
      if (currentCol.length) columns.push(currentCol);
      let html = '<div style="display:flex;overflow-x:auto;gap:4px;padding:8px 0;justify-content:center;">';
      columns.forEach(col => {
        html += '<div style="display:flex;flex-direction:column;gap:4px;">';
        col.forEach(item => html += `<div class="trend-item ${item.color}">${item.label}</div>`);
        html += '</div>';
      });
      return html + '</div>';
    }

    function renderComboRoad(arr) {
      if (!arr.length) return '<div class="no-pattern">暂无数据</div>';
      const columns = [];
      let currentCol = [];
      arr.forEach(d => {
        const type = getComboType(d);
        if (!currentCol.length || currentCol[0].type === type) {
          currentCol.push({ label: type, color: getComboColor(type), type });
        } else {
          columns.push([...currentCol]);
          currentCol = [{ label: type, color: getComboColor(type), type }];
        }
      });
      if (currentCol.length) columns.push(currentCol);
      let html = '<div style="display:flex;overflow-x:auto;gap:4px;padding:8px 0;justify-content:center;">';
      columns.forEach(col => {
        html += '<div style="display:flex;flex-direction:column;gap:4px;">';
        col.forEach(item => html += `<div class="trend-item ${item.color}">${item.label}</div>`);
        html += '</div>';
      });
      return html + '</div>';
    }

    function renderComboGrid(arr) {
      if (!arr.length) return '<div class="no-pattern">暂无数据</div>';
      let html = '<div style="display:grid; grid-template-columns:repeat(10, 34px); gap:6px; justify-content:center; margin:0 auto;">';
      arr.forEach(d => {
        const type = getComboType(d);
        const color = getComboColor(type);
        html += `<div class="trend-item ${color}">${type}</div>`;
      });
      for (let i = 0; i < 10; i++) {
        html += `<div class="trend-item" style="background:#ffffff; border:1px solid #ddd;"></div>`;
      }
      html += '</div>';
      return html;
    }

    function renderTailGrid(arr) {
      if (!arr.length) return '<div class="no-pattern">暂无数据</div>';
      let html = '<div style="display:grid; grid-template-columns:repeat(10, 34px); gap:6px; justify-content:center; margin:0 auto;">';
      arr.forEach(d => {
        const tail = (d.sum || 0) % 10;
        html += `<div class="trend-item tail-${tail}">${tail}</div>`;
      });
      for (let i = 0; i < 10; i++) {
        html += `<div class="trend-item" style="background:#ffffff; border:1px solid #ddd;"></div>`;
      }
      html += '</div>';
      return html;
    }

    function renderExtremeGrid(arr) {
      if (!arr.length) return '<div class="no-pattern">暂无数据</div>';
      let html = '<div style="display:grid; grid-template-columns:repeat(10, 34px); gap:6px; justify-content:center; margin:0 auto;">';
      arr.forEach(d => {
        const sum = d.sum || 0;
        const isExtreme = sum >= 22 || sum <= 5;
        const color = isExtreme ? 'red' : 'green';
        const label = isExtreme ? (sum >= 22 ? '极大' : '极小') : sum;
        html += `<div class="trend-item ${color}">${label}</div>`;
      });
      for (let i = 0; i < 10; i++) {
        html += `<div class="trend-item" style="background:#ffffff; border:1px solid #ddd;"></div>`;
      }
      html += '</div>';
      return html;
    }

    function renderShapeGrid(arr) {
      if (!arr.length) return '<div class="no-pattern">暂无数据</div>';
      let html = '<div style="display:grid; grid-template-columns:repeat(10, 34px); gap:6px; justify-content:center; margin:0 auto;">';
      arr.forEach(d => {
        const shape = d.shape || '杂六';
        let color = 'green';
        let label = '杂';
        if (shape === '对子') { color = 'blue'; label = '对'; }
        else if (shape === '顺子') { color = 'red'; label = '顺'; }
        else if (shape === '豹子') { color = 'black'; label = '豹'; }
        html += `<div class="trend-item ${color}">${label}</div>`;
      });
      for (let i = 0; i < 10; i++) {
        html += `<div class="trend-item" style="background:#ffffff; border:1px solid #ddd;"></div>`;
      }
      html += '</div>';
      return html;
    }

    function renderDigitGrid(arr, key) {
      if (!arr.length) return '<div class="no-pattern">暂无数据</div>';
      let html = '<div style="display:grid; grid-template-columns:repeat(10, 34px); gap:6px; justify-content:center; margin:0 auto;">';
      arr.forEach(d => {
        const num = d[key] || 0;
        html += `<div class="trend-item tail-${num}">${num}</div>`;
      });
      for (let i = 0; i < 10; i++) {
        html += `<div class="trend-item" style="background:#ffffff; border:1px solid #ddd;"></div>`;
      }
      html += '</div>';
      return html;
    }

    function renderModGrid(arr, divisor) {
      if (!arr.length) return '<div class="no-pattern">暂无数据</div>';
      let html = '<div style="display:grid; grid-template-columns:repeat(10, 34px); gap:6px; justify-content:center; margin:0 auto;">';
      arr.forEach(d => {
        const mod = (d.sum || 0) % divisor;
        html += `<div class="trend-item mod-${mod}">${d.sum || 0}</div>`;
      });
      for (let i = 0; i < 10; i++) {
        html += `<div class="trend-item" style="background:#ffffff; border:1px solid #ddd;"></div>`;
      }
      html += '</div>';
      return html;
    }

    function getComboType(d) {
      if (d.big && d.odd) return '大单';
      if (d.big && !d.odd) return '大双';
      if (!d.big && d.odd) return '小单';
      return '小双';
    }

    function getComboColor(type) {
      if (type === '大单') return 'green';
      if (type === '小单') return 'gray';
      if (type === '大双') return 'red';
      return 'blue';
    }

    function isSingleComboFrog(arr) {
      if (arr.length < 6) return false;
      const types = arr.map(d => getComboType(d));
      let maxStreak = 1, cur = 1;
      for (let i = 1; i < types.length; i++) {
        if (types[i] === types[i-1]) {
          cur++;
          maxStreak = Math.max(maxStreak, cur);
        } else cur = 1;
      }
      return maxStreak <= 4;
    }

    function isFourColorCycle(arr) {
      if (arr.length < 4) return false;
      const types = arr.slice(-8).map(d => getComboType(d));
      const cycles = [
        ['大单','小单','小双','大双'],
        ['小单','小双','大双','大单'],
        ['小双','大双','大单','小单'],
        ['大双','大单','小单','小双']
      ];
      for (const cycle of cycles) {
        let match = true;
        for (let i = 0; i < Math.min(types.length, cycle.length); i++) {
          if (types[types.length - 1 - i] !== cycle[i]) {
            match = false;
            break;
          }
        }
        if (match) return true;
      }
      return false;
    }

   function isColdCombo(arr) {
  if (arr.length < 30) return false;
  const recent = arr.slice(-30);
  const count = { '大单': 0, '小单': 0, '大双': 0, '小双': 0 };
  recent.forEach(d => {
    const type = getComboType(d);
    if (count.hasOwnProperty(type)) count[type]++;
  });
  // 某个组合近30期出现次数 ≤ 15 才算冷门（冷门超过15期）
  return Object.values(count).some(c => c <= 15);
}
