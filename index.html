
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>野寻加拿大28学堂</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 20px 30px;
      text-align: center;
    }
    .header h1 { font-size: 26px; margin-bottom: 8px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .main-menu { padding: 20px; }
    .level-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      cursor: pointer;
    }
    .level-card.disabled { opacity: 0.55; cursor: not-allowed; }
    .icon-box {
      width: 56px; height: 56px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
    }
    .icon-beginner { background: #e8f5e9; }
    .icon-intermediate { background: #fff3e0; }
    .icon-advanced { background: #fce4ec; }
    .card-info h3 { font-size: 18px; margin-bottom: 4px; }
    .card-info p { font-size: 13px; color: #888; }
    .badge {
      margin-left: auto; background: #eee; color: #888;
      font-size: 12px; padding: 4px 10px; border-radius: 20px;
    }
    .content { display: none; padding: 12px; background: white; min-height: 100vh; }
    .content.active { display: block; }
    .back-btn {
      margin-bottom: 12px; padding: 10px 18px;
      background: #667eea; color: white; border: none;
      border-radius: 8px; font-size: 15px;
    }
    .alert-box {
      background: #ffebee; border: 2px solid #e74c3c; color: #c0392b;
      padding: 14px; border-radius: 10px; text-align: center;
      font-weight: bold; font-size: 16px; margin-bottom: 12px; display: none;
    }
    .stats { background: #f8f8f8; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .stats h3 { text-align: center; margin-bottom: 12px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-item { background: white; padding: 12px; border-radius: 8px; text-align: center; }
    .road-title {
      background: #f5d76e; color: #333; padding: 10px;
      border-radius: 8px 8px 0 0; font-weight: bold; text-align: center;
    }
    .road-grid {
      display: flex; overflow-x: auto; background: #fff;
      border: 1px solid #eee; border-top: none; padding: 8px;
      min-height: 160px; gap: 4px;
    }
    .road-column { display: flex; flex-direction: column; gap: 4px; }
    .circle {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: bold; color: white;
    }
    .circle.red { background: #e74c3c; }
    .circle.blue { background: #3498db; }
    .loading { text-align: center; padding: 50px; color: #999; }
    .refresh-tip { text-align: center; font-size: 12px; color: #999; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- 主菜单 -->
  <div id="menu">
    <div class="header">
      <h1>野寻加拿大28学堂</h1>
      <p>学习 · 统计 · 规律分析</p>
    </div>
    <div class="main-menu">
      <div class="level-card" onclick="openLevel('beginner')">
        <div class="icon-box icon-beginner">🌱</div>
        <div class="card-info">
          <h3>初级学堂</h3>
          <p>大小单双统计 · 路子图 · 连开提醒</p>
        </div>
      </div>
      <div class="level-card disabled">
        <div class="icon-box icon-intermediate">🔥</div>
        <div class="card-info">
          <h3>中级学堂</h3>
          <p>更多规律分析</p>
        </div>
        <div class="badge">即将开放</div>
      </div>
      <div class="level-card disabled">
        <div class="icon-box icon-advanced">👑</div>
        <div class="card-info">
          <h3>高级学堂</h3>
          <p>深度数据研究</p>
        </div>
        <div class="badge">即将开放</div>
      </div>
    </div>
  </div>

  <!-- 初级学堂 -->
  <div id="beginner" class="content">
    <button class="back-btn" onclick="backToMenu()">← 返回主界面</button>
    <div class="refresh-tip">数据每30秒自动刷新</div>
    <div id="alert-box" class="alert-box"></div>
    <div id="loading" class="loading">正在获取最新开奖数据...</div>
    <div id="beginner-content" style="display:none;">
      <div class="stats">
        <h3>最近100期统计</h3>
        <div class="stats-grid">
          <div class="stat-item">大：<span id="big-count">0</span> 次 (<span id="big-percent">0</span>%)</div>
          <div class="stat-item">小：<span id="small-count">0</span> 次 (<span id="small-percent">0</span>%)</div>
          <div class="stat-item">单：<span id="odd-count">0</span> 次 (<span id="odd-percent">0</span>%)</div>
          <div class="stat-item">双：<span id="even-count">0</span> 次 (<span id="even-percent">0</span>%)</div>
        </div>
      </div>
      <div class="road-section">
        <div class="road-title">大小路</div>
        <div id="big-small-road" class="road-grid"></div>
      </div>
      <div class="road-section" style="margin-top:16px;">
        <div class="road-title">单双路</div>
        <div id="odd-even-road" class="road-grid"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let refreshTimer = null;

    function openLevel(level) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById(level).classList.add('active');
      if (level === 'beginner') {
        loadBeginnerData();
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(loadBeginnerData, 30000);
      }
    }

    function backToMenu() {
      if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
      document.getElementById('beginner').classList.remove('active');
      document.getElementById('menu').style.display = 'block';
    }

    function playAlertSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.start();
        setTimeout(() => osc.frequency.value = 660, 180);
        setTimeout(() => osc.frequency.value = 880, 360);
        setTimeout(() => { osc.stop(); ctx.close(); }, 540);
      } catch(e) {}
    }

    async function loadBeginnerData() {
      const loading = document.getElementById('loading');
      const content = document.getElementById('beginner-content');
      if (content.style.display === 'none') loading.style.display = 'block';

      try {
        const res = await fetch('https://pc28.world/api/v1/draws?limit=100&_=' + Date.now());
        const json = await res.json();
        if (!json.ok) throw new Error();

        const draws = json.data.items.slice().reverse();
        renderStats(draws);
        renderRoad(draws, 'big', 'big-small-road');
        renderRoad(draws, 'odd', 'odd-even-road');
        checkStreaks(draws);

        loading.style.display = 'none';
        content.style.display = 'block';
      } catch (err) {
        loading.textContent = '加载失败，请稍后重试';
      }
    }

    function checkStreaks(draws) {
      const box = document.getElementById('alert-box');
      const msgs = [];
      if (!draws.length) return;
      const last = draws[draws.length - 1];

      let streak = 1;
      for (let i = draws.length - 2; i >= 0; i--) {
        if (draws[i].big === last.big) streak++;
        else break;
      }
      if (streak >= 5) msgs.push(`已连${last.big ? '大' : '小'} ${streak} 期`);

      streak = 1;
      for (let i = draws.length - 2; i >= 0; i--) {
        if (draws[i].odd === last.odd) streak++;
        else break;
      }
      if (streak >= 5) msgs.push(`已连${last.odd ? '单' : '双'} ${streak} 期`);

      if (msgs.length) {
        box.innerHTML = msgs.join('<br>');
        box.style.display = 'block';
        playAlertSound();
      } else {
        box.style.display = 'none';
      }
    }

    function renderStats(draws) {
      let big=0, small=0, odd=0, even=0;
      draws.forEach(d => {
        d.big ? big++ : small++;
        d.odd ? odd++ : even++;
      });
      const t = draws.length || 1;
      document.getElementById('big-count').textContent = big;
      document.getElementById('small-count').textContent = small;
      document.getElementById('odd-count').textContent = odd;
      document.getElementById('even-count').textContent = even;
      document.getElementById('big-percent').textContent = (big/t*100).toFixed(1);
      document.getElementById('small-percent').textContent = (small/t*100).toFixed(1);
      document.getElementById('odd-percent').textContent = (odd/t*100).toFixed(1);
      document.getElementById('even-percent').textContent = (even/t*100).toFixed(1);
    }

    function renderRoad(draws, type, id) {
      const container = document.getElementById(id);
      container.innerHTML = '';
      const cols = [];
      let cur = [];
      draws.forEach(d => {
        const positive = type === 'big' ? d.big : d.odd;
        const label = type === 'big' ? (d.big?'大':'小') : (d.odd?'单':'双');
        const color = positive ? 'red' : 'blue';
        if (!cur.length || cur[0].positive === positive) {
          cur.push({label, color, positive});
        } else {
          cols.push(cur);
          cur = [{label, color, positive}];
        }
      });
      if (cur.length) cols.push(cur);
      cols.forEach(col => {
        const div = document.createElement('div');
        div.className = 'road-column';
        col.forEach(item => {
          const c = document.createElement('div');
          c.className = 'circle ' + item.color;
          c.textContent = item.label;
          div.appendChild(c);
        });
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
