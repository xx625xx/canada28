
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>野寻加拿大28学堂</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 20px 30px;
      text-align: center;
    }
    .header h1 { font-size: 26px; margin-bottom: 8px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .main-menu { padding: 20px; }
    .level-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      cursor: pointer;
    }
    .level-card.disabled { opacity: 0.55; cursor: not-allowed; }
    .icon-box {
      width: 56px; height: 56px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
    }
    .icon-beginner { background: #e8f5e9; }
    .icon-intermediate { background: #fff3e0; }
    .icon-advanced { background: #fce4ec; }
    .card-info h3 { font-size: 18px; margin-bottom: 4px; }
    .card-info p { font-size: 13px; color: #888; }
    .badge {
      margin-left: auto; background: #eee; color: #888;
      font-size: 12px; padding: 4px 10px; border-radius: 20px;
    }
    .content { display: none; padding: 12px; background: white; min-height: 100vh; }
    .content.active { display: block; }
    .back-btn {
      margin-bottom: 12px; padding: 10px 18px;
      background: #667eea; color: white; border: none;
      border-radius: 8px; font-size: 15px;
    }
    .pattern-list { padding: 10px 0; }
    .pattern-item {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pattern-item:active { background: #eee; }
    .result-area {
      margin-top: 16px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 12px;
      min-height: 100px;
    }
    .no-pattern {
      text-align: center;
      color: #999;
      padding: 40px 0;
      font-size: 16px;
    }
    .trend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .trend-item {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: bold; color: white;
    }
    .red { background: #e74c3c; }
    .blue { background: #3498db; }
    .loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>

  <div id="menu">
    <div class="header">
      <h1>野寻加拿大28学堂</h1>
      <p>学习 · 统计 · 规律分析</p>
    </div>
    <div class="main-menu">
      <div class="level-card" onclick="openLevel('beginner')">
        <div class="icon-box icon-beginner">🌱</div>
        <div class="card-info">
          <h3>初级学堂</h3>
          <p>多种规律看板</p>
        </div>
      </div>
      <div class="level-card disabled">
        <div class="icon-box icon-intermediate">🔥</div>
        <div class="card-info">
          <h3>中级学堂</h3>
          <p>更多规律分析</p>
        </div>
        <div class="badge">即将开放</div>
      </div>
      <div class="level-card disabled">
        <div class="icon-box icon-advanced">👑</div>
        <div class="card-info">
          <h3>高级学堂</h3>
          <p>深度数据研究</p>
        </div>
        <div class="badge">即将开放</div>
      </div>
    </div>
  </div>

  <div id="beginner" class="content">
    <button class="back-btn" onclick="backToMenu()">← 返回主界面</button>
    <div id="pattern-list" class="pattern-list"></div>
    <div id="result-area" class="result-area" style="display:none;"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let draws = [];
    let refreshTimer = null;

    const patterns = [
      { id: 'frog', name: '青蛙跳规律看板' },
      { id: '2f1t', name: '两房一厅规律看板' },
      { id: '3f1t', name: '三房一厅规律看板' },
      { id: '2f2t', name: '两房两厅规律看板' },
      { id: '3f2t', name: '三房两厅规律看板' },
      { id: '3f3t', name: '三房三厅规律看板' },
      { id: '4dragon', name: '四小龙规律看板' },
      { id: '5dragon', name: '五小龙规律看板' },
      { id: '6dragon', name: '六长龙规律看板' }
    ];

    function openLevel(level) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById(level).classList.add('active');
      if (level === 'beginner') {
        renderPatternList();
        loadData();
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(loadData, 30000);
      }
    }

    function backToMenu() {
      if (refreshTimer) clearInterval(refreshTimer);
      document.getElementById('beginner').classList.remove('active');
      document.getElementById('menu').style.display = 'block';
      document.getElementById('result-area').style.display = 'none';
    }

    function renderPatternList() {
  const list = document.getElementById('pattern-list');
  list.innerHTML = patterns.map(p => {
    const matched = isPatternMatched(p.id);
    const badge = matched ? '<span style="color:#e74c3c;font-size:13px;margin-left:8px;">一条发财路未读</span>' : '';
    return `<div class="pattern-item" onclick="checkPattern('${p.id}')">${p.name}${badge} <span>›</span></div>`;
  }).join('');
}

function isPatternMatched(id) {
  if (!draws.length) return false;
  const recent = getRecent(30);
  if (id === 'frog') return isFrogJump(recent);

  if (id === '2f1t') return isHouseHall(recent, 2, 1);
  if (id === '3f1t') return isHouseHall(recent, 3, 1);
  if (id === '2f2t') return isHouseHall(recent, 2, 2);
  if (id === '3f2t') return isHouseHall(recent, 3, 2);
  if (id === '3f3t') return isHouseHall(recent, 3, 3);
  if (id === '4dragon') return isDragon(recent, 4);
  if (id === '5dragon') return isDragon(recent, 5);
  if (id === '6dragon') return isDragon(recent, 6);
  return false;
}

    async function loadData() {
      try {
        const res = await fetch('https://pc28.world/api/v1/draws?limit=100&_=' + Date.now());
        const json = await res.json();
       if (json.ok) {
  draws = json.data.items.slice().reverse();
  renderPatternList();
}
      } catch (e) {}
    }

    function getRecent(n = 20) {
      return draws.slice(-n);
    }

   function checkPattern(id) {
  // 先清除所有已显示的结果
  document.querySelectorAll('.inline-result').forEach(el => el.remove());

  const recent = getRecent(30);
  let matched = false;
  let displayData = getRecent(20);

  if (id === 'frog') matched = isFrogJump(recent);
  else if (id === '2f1t') matched = isHouseHall(recent, 2, 1);
  else if (id === '3f1t') matched = isHouseHall(recent, 3, 1);
  else if (id === '2f2t') matched = isHouseHall(recent, 2, 2);
  else if (id === '3f2t') matched = isHouseHall(recent, 3, 2);
  else if (id === '3f3t') matched = isHouseHall(recent, 3, 3);
  else if (id === '4dragon') matched = isDragon(recent, 4);
  else if (id === '5dragon') matched = isDragon(recent, 5);
  else if (id === '6dragon') matched = isDragon(recent, 6);

  // 找到被点击的那个看板
  const items = document.querySelectorAll('.pattern-item');
  let targetItem = null;
  items.forEach(item => {
    if (item.getAttribute('onclick') && item.getAttribute('onclick').includes(id)) {
      targetItem = item;
    }
  });

  if (!targetItem) return;

  const resultDiv = document.createElement('div');
  resultDiv.className = 'inline-result';
  resultDiv.style.cssText = 'margin: 8px 0 16px 0; padding: 12px; background: #f8f9fa; border-radius: 12px;';

  if (matched) {
    resultDiv.innerHTML = '<div style="text-align:center;margin-bottom:8px;font-weight:bold;">近20期走势</div>' + renderTrend(displayData);
  } else {
    resultDiv.innerHTML = '<div class="no-pattern">暂时无此规律</div>';
  }

  targetItem.after(resultDiv);
}

   function isFrogJump(arr) {
  if (arr.length < 4) return false;
  const last = arr.slice(-8); // 多取一些期数检查两个回合
  
  // 检查大小跳两个回合
  let bigJumpRounds = 0;
  for (let i = 1; i < last.length; i++) {
    if (last[i].big !== last[i-1].big) {
      bigJumpRounds++;
    } else {
      bigJumpRounds = 0;
    }
    if (bigJumpRounds >= 3) return true; // 大小大小 需要至少3次变化
  }
  
  // 检查单双跳两个回合
  let oddJumpRounds = 0;
  for (let i = 1; i < last.length; i++) {
    if (last[i].odd !== last[i-1].odd) {
      oddJumpRounds++;
    } else {
      oddJumpRounds = 0;
    }
    if (oddJumpRounds >= 3) return true;
  }
  return false;
}

    function isHouseHall(arr, house, hall) {
  const need = (house + hall) * 2; // 两个回合
  if (arr.length < need) return false;
  const last = arr.slice(-need);
  
  // 检查大小是否构成两个回合
  let bigCount = 0, smallCount = 0;
  for (let d of last) {
    if (d.big) bigCount++; else smallCount++;
  }
  const sizeOk = (bigCount === house * 2 && smallCount === hall * 2) || 
                 (smallCount === house * 2 && bigCount === hall * 2);
  
  // 检查单双是否构成两个回合
  let oddCount = 0, evenCount = 0;
  for (let d of last) {
    if (d.odd) oddCount++; else evenCount++;
  }
  const oddOk = (oddCount === house * 2 && evenCount === hall * 2) || 
                (evenCount === house * 2 && oddCount === hall * 2);
  
  return sizeOk || oddOk;
}

 function isDragon(arr, count) {
  if (arr.length < count) return false;
  const last = arr[arr.length - 1];
  
  // 检查大小连
  let bigSmallCount = 1;
  for (let i = arr.length - 2; i >= 0; i--) {
    if (arr[i].big === last.big) bigSmallCount++;
    else break;
  }
  if (bigSmallCount >= count) return true;

  // 检查单双连
  let oddEvenCount = 1;
  for (let i = arr.length - 2; i >= 0; i--) {
    if (arr[i].odd === last.odd) oddEvenCount++;
    else break;
  }
  return oddEvenCount >= count;
}


  function renderTrend(arr) {
  if (!arr.length) return '';
  
  const columns = [];
  let currentCol = [];
  
  arr.forEach(d => {
    const isBig = d.big;
    if (currentCol.length === 0 || currentCol[0].isBig === isBig) {
      currentCol.push({ label: isBig ? '大' : '小', color: isBig ? 'red' : 'blue', isBig });
    } else {
      columns.push(currentCol);
      currentCol = [{ label: isBig ? '大' : '小', color: isBig ? 'red' : 'blue', isBig }];
    }
  });
  if (currentCol.length) columns.push(currentCol);

  let html = '<div style="display:flex; overflow-x:auto; gap:4px; padding:8px 0; justify-content:center;">';
  columns.forEach(col => {
    html += '<div style="display:flex; flex-direction:column; gap:4px;">';
    col.forEach(item => {
      html += `<div class="trend-item ${item.color}">${item.label}</div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

  </script>
</body>
</html>
